name: Build AzanApp APK

on:
  push:
    branches: [ "main" ]
  pull_request:
    branches: [ "main" ]

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'

      # هنا عطلنا ميزة الـ Cache تماماً لنتفادى عطل سيرفرات GitHub
      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v3
        with:
          cache-disabled: true

      # سنضيف أوامر تفعيل AndroidX هنا مباشرة للتأكد من حل المشكلة السابقة
      - name: Build APK
        run: gradle assembleDebug -Pandroid.useAndroidX=true -Pandroid.enableJetifier=true

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: AzanApp-DEBUG
          path: app/build/outputs/apk/debug/*.apk
